<section id="products" class="py-24 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Section header -->
    <div class="text-center mb-16">
      <span class="text-ceramic-600 font-semibold text-sm tracking-wider uppercase">OUR COLLECTIONS</span>
      <h2 class="text-4xl md:text-5xl font-serif font-bold text-ceramic-900 mt-2">
        Exquisite Ceramic Crafts
      </h2>
      <p class="text-ceramic-700 mt-4 max-w-2xl mx-auto text-lg">
        Hand-selected ceramic pieces featuring traditional techniques and modern aesthetics
      </p>
    </div>

    <!-- Products grid -->
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (product of products; track product.id) {
        <div class="group cursor-pointer">
          <div class="bg-gradient-to-br from-ceramic-50 to-clay-50 rounded-2xl p-8 h-64 flex flex-col items-center justify-center shadow-lg hover:shadow-xl transition group-hover:from-ceramic-100 group-hover:to-clay-100">
            <div class="text-5xl mb-4 group-hover:scale-110 transition transform">{{ product.icon }}</div>
            <h3 class="text-xl font-serif font-bold text-ceramic-900 text-center">{{ product.name }}</h3>
          </div>
          <div class="mt-4">
            <p class="text-ceramic-600 text-sm font-medium">{{ product.category }}</p>
            <p class="text-ceramic-800 text-sm mt-2">{{ product.description }}</p>
            <p class="text-ceramic-900 font-bold text-lg mt-2">{{ product.price }}</p>
          </div>
        </div>
      }
    </div>

    <!-- CTA -->
    <div class="text-center mt-16">
      <button class="bg-ceramic-600 hover:bg-ceramic-700 text-white px-8 py-4 rounded-lg font-semibold text-lg transition transform hover:scale-105">
        View Full Collection
      </button>
    </div>
  </div>
</section>
